<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tycoon Game</title>
<style>
    body {
        font-family: Arial;
        text-align: center;
        margin-top: 80px;
        background: #f2f2f2;
    }

    #money {
        font-size: 40px;
        margin: 20px;
    }

    button {
        padding: 15px 30px;
        font-size: 18px;
        margin: 10px;
    }
</style>
</head>
<body>

<h1>💰 Tycoon Game</h1>

<div id="money">0</div>

<button onclick="clickMoney()">Click</button>
<button onclick="buyUpgrade()">Upgrade (Cost: <span id="cost">10</span>)</button>

<script>
let money = 0;
let income = 1;
let cost = 10;

function update() {
    document.getElementById("money").innerText = money;
    document.getElementById("cost").innerText = cost;
}

function clickMoney() {
    money += income;
    update();
}

function buyUpgrade() {
    if (money >= cost) {
        money -= cost;
        income++;
        cost = Math.floor(cost * 1.5);
        update();
    }
}

update();
</script>

</body>
</html>
